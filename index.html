<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Team_Aurora</title>

    <link
        rel="stylesheet"
        href="./Museum_of_the_Abandoned/index.css"
    >
</head>

<body>

<main id="main">

    <div id="storyPage">

        <!-- =================================================
             BACKGROUND
        ================================================== -->

        <div id="starField"></div>
        <div id="ambientGlow"></div>
        <div id="vignette"></div>


        <!-- =================================================
             HEADER
        ================================================== -->

        <header id="storyHeader">

            <div class="header-left">

                <div class="nasa-kicker">
                    
                </div>

                <div class="exhibition-name">
                    
                </div>

            </div>

            <div class="header-right">

                <div id="storyProgress">
                    01 / 05
                </div>

            </div>

        </header>


        <!-- =================================================
             MAIN EXHIBITION AREA
        ================================================== -->

        <section id="exhibitionArea">

            <!-- =============================================
                 LEFT STORY PANEL
            ============================================== -->

            <article
                id="storyPanel"
                class="dialogue-panel story-panel"
            >

                <span class="panel-number">
                    STORY / 01
                </span>

                <span class="corner corner-top-left"></span>
                <span class="corner corner-top-right"></span>
                <span class="corner corner-bottom-left"></span>
                <span class="corner corner-bottom-right"></span>

                <span class="panel-line line-top"></span>
                <span class="panel-line line-right"></span>
                <span class="panel-line line-bottom"></span>
                <span class="panel-line line-left"></span>

                <div class="story-inner">

                    <div id="storyAvatar">
                        <img
                            id="avatarImage"
                            src="./Museum_of_the_Abandoned/story_images/1st_page_story_avatar.png"
                            alt="Story narrator"
                        >
                    </div>

                    <div
                        id="storyKicker"
                        class="story-kicker"
                    >
                        THE BEGINNING
                    </div>

                    <h1 id="storyTitle">
                        Hi Explorer!
                    </h1>

                    <div class="title-divider"></div>

                    <p id="storyText">
                        Do you know the average distances
                        between the Moon and Earth, and
                        Mars and Earth?
                    </p>

                    <div class="story-footer">

                        <span class="footer-dot"></span>

                        <span id="storyFooterText">
                            BEGINNING OF LUNAR EXPLORATION
                        </span>

                    </div>

                </div>

            </article>


            <!-- =============================================
                 RIGHT IMAGE PANEL
            ============================================== -->

            <article
                id="imagePanel"
                class="dialogue-panel image-panel"
            >

                <span class="panel-number">
                    ARCHIVE / 01
                </span>

                <span class="corner corner-top-left"></span>
                <span class="corner corner-top-right"></span>
                <span class="corner corner-bottom-left"></span>
                <span class="corner corner-bottom-right"></span>

                <div class="image-header">

                    <span id="imageCounter">
                        IMAGE 01 / 04
                    </span>

                </div>


                <!-- IMAGE SLIDER -->

                <div class="image-frame">

                    <div
                        id="imageTrack"
                        class="image-track"
                    ></div>

                    <div class="image-dark"></div>

                    <div class="scan-line"></div>

                    <span class="image-corner image-corner-tl"></span>
                    <span class="image-corner image-corner-tr"></span>
                    <span class="image-corner image-corner-bl"></span>
                    <span class="image-corner image-corner-br"></span>

                </div>


                <!-- IMAGE INFORMATION -->

                <div class="image-info">

                    <div
                        id="imageTitle"
                        class="image-title"
                    >
                        LUNAR ARCHIVE
                    </div>

                    <div
                        id="imageDescription"
                        class="image-description"
                    >
                        Historical imagery from the lunar
                        exploration archive.
                    </div>

                </div>


                <!-- IMAGE DOTS -->

                <div
                    id="imageDots"
                    class="image-dots"
                ></div>

            </article>

        </section>


        <!-- =================================================
             BOTTOM INFORMATION
        ================================================== -->

        <div id="bottomInfo">

            <span>
                LUNAR EXPLORATION
            </span>

            <span class="bottom-divider"></span>

            <span>
                NASA ARCHIVE
            </span>

        </div>


        <!-- =================================================
             BACK BUTTON
        ================================================== -->

        <button
            id="backButton"
            type="button"
            aria-label="Previous story"
        >
            <span class="back-arrow">←</span>
        </button>




        <!-- =================================================
             NEXT BUTTON
        ================================================== -->

        <button
            id="nextButton"
            type="button"
            aria-label="Next story"
        >

            <span class="arrow-shaft"></span>

            <span
                id="nextButtonText"
                class="arrow-head"
            >
                →
            </span>

        </button>


        <!-- =================================================
             PROGRESS BAR
        ================================================== -->

        <div id="progressTrack">
            <div id="progressBar"></div>
        </div>

    </div>

</main>

<script src="./Museum_of_the_Abandoned/index.js"></script>

</body>
</html>
